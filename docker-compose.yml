version: "3.9"

services:
  mysql-db:
    image: mysql:8.0
    container_name: ditenun-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: DiTenunModulLidi
      MYSQL_TCP_PORT: 3306
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ditenun-django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py seed_accounts &&
             python manage.py seed_characteristics &&
             python manage.py seed_colors &&
             python manage.py runserver 0.0.0.0:8000"
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: DiTenunModulLidi
      DB_USER: root
      DB_PASSWORD: root
      DJANGO_SETTINGS_MODULE: Website.settings
    depends_on:
      mysql-db:
        condition: service_healthy

  editor-ui:
    image: node:20-alpine
    container_name: ditenun-editor-ui
    working_dir: /app/editor-ui
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - django

volumes:
  mysql-data:
